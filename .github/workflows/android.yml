name: android

# Catches the app breaking on a normal push, so a tag is never the first time anyone finds
# out. Debug build only — assembleRelease is the release workflow's job, and doing it twice
# would double the slowest step in the repo for no extra signal.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `android-actions/setup-android@v3` stood here and stopped working in September 2026.
      # The evidence, since nothing in this repository had changed: both workflows that use
      # it died fourteen seconds in while `core` — the one workflow with no Android SDK in it
      # — stayed green on the same commit; re-tagging reproduced it exactly; and GitHub's own
      # Node-deprecation annotation, which names each action as it runs, listed eight actions
      # on the last good run and three on the broken one, stopping at this line.
      #
      # It was never doing much. `ubuntu-latest` ships the Android SDK with its licences
      # already accepted, and AGP downloads whatever platform or build-tools version the build
      # asks for. So: use the image's own SDK, and say so loudly if it is ever not there. One
      # less moving part between a tag and an APK.
      - name: Use the runner's Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${SDK}" ] || [ ! -d "${SDK}" ]; then
            echo "::error::no Android SDK on this runner image (ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}, ANDROID_HOME=${ANDROID_HOME})"
            exit 1
          fi
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "$GITHUB_ENV"
          echo "sdk.dir=${SDK}" > local.properties
          echo "Android SDK at ${SDK}"
          ls "${SDK}/platforms" 2>/dev/null || echo "no platforms yet — AGP will fetch one"

      - uses: gradle/actions/setup-gradle@v4

      # Renders every screen through layoutlib on the JVM. Not a pixel comparison — golden
      # images across layoutlib versions are a maintenance tax — but a screen that throws,
      # overflows its constraints or fails to compose fails here instead of in a field.
      - name: Render the screens
        run: ./gradlew :app:recordPaparazziDebug --no-daemon

      - name: Keep the renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: app/build/reports/paparazzi/

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Report APK size
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "### APK $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Worth watching: §4.1 budgets a quantised ViT-B/16 on top of this." >> "$GITHUB_STEP_SUMMARY"
