name: core

# The rollup is the product, so it gets the fastest feedback loop in the repo:
# pure Kotlin/JVM, no Android SDK, no emulator, seconds not minutes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The golden fixture is generated by the Python reference implementation and
      # asserted by the Kotlin one. Regenerating it here rather than trusting the
      # committed copy would defeat the point — so the Python side only *verifies*
      # that what is committed still matches what it produces.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Golden fixture is in sync with the Python reference
        working-directory: training
        run: |
          pip install -e '.[dev]'
          python tools/gen_golden.py --check

      - name: Kotlin rollup reproduces the fixture
        run: ./gradlew :core:test --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core/build/reports/tests/test/
          if-no-files-found: ignore
