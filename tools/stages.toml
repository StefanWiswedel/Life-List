# The long-running pipeline stages, as named verbs with fixed argument vectors.
#
# Read by tools/lifelist_mcp.py on every `stage` call, so adding one here is enough — the MCP
# server does not need restarting and neither does the desktop app. Same rule as everything
# else in that server: the caller picks a name from this file, never a command. Each entry must
# run a `lifelist_train` module with `-m`; anything else is ignored.
#
# `train` is absent on purpose. It takes an hour and writes the shipped head, so it stays a
# thing a person starts deliberately.
#
# Paths are relative to `training/`, which is the working directory these run in.

[stages]

# Rebuild the iNaturalist->GBIF crossing from stage 1's dump. Needed when the document's
# *shape* changes, not when the model does. Ten minutes, mostly fetching the families.
bridge = [
    "-m", "lifelist_train.cli.bridge",
    "--taxa-raw", "cache/taxa_raw.json.gz",
    "--joined", "cache/stage2_joined",
    "--min-observations", "20",
]

# Rewrite taxonomy.json alone, refusing if the leaf ordering moved under the shipped head.
taxonomy = [
    "-m", "lifelist_train.cli.train",
    "--cache-dir", "cache",
    "--min-observations", "20",
    "--taxonomy-only",
]

# One rollup threshold per group, against an accuracy a person can ask for. No training: the
# head is already fitted, so this is a split, a matrix multiply and a sweep. Prints the table
# and writes nothing without --commit.
thresholds = ["-m", "lifelist_train.cli.thresholds", "--cache-dir", "cache", "-v"]

# The same sweep, saved into model_meta.json. Separate from `thresholds` on purpose: reading
# the table and agreeing to it are two decisions, and the second one edits a shipped file.
thresholds-commit = [
    "-m", "lifelist_train.cli.thresholds",
    "--cache-dir", "cache",
    "--commit",
    "-v",
]

# Rebuild the reference-photo index for every leaf in the current taxonomy. Two minutes of
# iNaturalist API at their asked-for one request a second.
reference-index = [
    "-m", "lifelist_train.cli.reference_index",
    "--bridge", "../shared/model/taxon_bridge.json",
    "--taxonomy", "../shared/model/taxonomy.json",
    "--out", "../shared/model/reference_photos.json",
]

# BirdNET's 801 western-palearctic classes crossed into GBIF, producing the audio taxonomy and
# the class map. Twenty seconds of GBIF; prints the refusals and writes nothing without --commit.
birdnet = [
    "-m", "lifelist_train.cli.birdnet",
    "--labels", "../shared/birdnet/birdnet-v3.0-preview3.1-western-palearctic-labels-b1.txt",
    "-v",
]

birdnet-commit = [
    "-m", "lifelist_train.cli.birdnet",
    "--labels", "../shared/birdnet/birdnet-v3.0-preview3.1-western-palearctic-labels-b1.txt",
    "--commit",
    "-v",
]

# 13,899 assessments over 695 pages, about eight minutes at the API's pace.
redlist = ["-m", "lifelist_train.cli.redlist", "-v"]

# Resumable and incremental: only titles that are neither cached nor known-absent. Covers the
# checklist's 26,722 species as well as the model's own, which is 32,244 distinct titles — a
# cloud container's proxy manages three batches a minute against the 1,613 needed, and this
# machine did 6,280 in 336 seconds (§70, §83). That difference is the whole reason this stage
# exists.
wikipedia = ["-m", "lifelist_train.cli.wikipedia", "-v"]

# Write the bundle from what the fetch has already banked, and fetch nothing.
#
# The fetch is resumable and the *write* was not: it only ran at the end of a completed run,
# so three half-hour runs killed by the MCP server's timeout banked 23,015 resolved titles and
# produced no file at all (§86). Seconds, and it makes every interrupted run worth something.
wikipedia-write = ["-m", "lifelist_train.cli.wikipedia", "--from-cache", "-v"]

# Denmark's species checklist from GBIF's occurrence facets: 52,000 keys down to the 26,722
# recorded at least five times, each resolved to a family and a name. Three passes, all cached
# and resumable; about fifteen minutes cold (§81).
# Denmark's national species register (arter.dk Taxonbasen), 3 MB, reduced to the names and
# genera the checklist filter needs. Seconds, and it is what tells cattle from a crow (§90).
register = ["-m", "lifelist_train.cli.register", "-v"]

# The differences between look-alikes, quoted out of the Wikipedia article bodies we already
# fetch and otherwise discard. Only genera holding two or more species the camera can name —
# 258 of them are insects, and the commonest 50 cover 77% of Danish insect records (§95).
characters = [
    "-m", "lifelist_train.cli.characters",
    "--seed", "../shared/characters-seed.json",
    "--out", "../app/src/main/assets/characters.json",
    "-v",
]

# Where the checklist is weakest, as a page: species Denmark's register knows only by
# genus, rarest first. Not a list to read — a list sorted so the questionable part is a
# few hundred rows instead of fourteen thousand (§92).
audit = [
    "-m", "lifelist_train.cli.audit",
    "--out", "../checklist-audit.html",
    "-v",
]

checklist = [
    "-m", "lifelist_train.cli.checklist",
    "--taxonomy", "../shared/model/taxonomy.json",
    "--out", "../shared/model/checklist.json",
    "-v",
]

# A curated, licensed photograph for the checklist species the model cannot identify. Crosses
# by name through iNaturalist's open-data taxa table — download it first, it is not in the
# repo: curl -o cache/inat_taxa.csv.gz https://inaturalist-open-data.s3.amazonaws.com/taxa.csv.gz
# Then 754 batched API calls rather than 22,605 (§83).
checklist-photos = [
    "-m", "lifelist_train.cli.checklist_photos",
    "--checklist", "../shared/model/checklist.json",
    "--out", "../shared/model/checklist_photos.json",
    "-v",
]

# The 350 MB ONNX. CI does this on every tag, so running it here is for checking that it still
# works before spending a release on finding out that it does not.
export = [
    "-m", "lifelist_train.cli.export",
    "--head", "../shared/model/head.npz",
    "--meta", "../shared/model/model_meta.json",
    "--out", "../app/src/main/assets/lifelist.onnx",
]
