[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifelist-train"
version = "0.1.0"
description = "Training pipeline for Life List — Danish organism identification"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "requests>=2.31",
    "tqdm>=4.66",
    # `lifelist-reference-photos` re-encodes what it downloads, which halves 200 MB of
    # reference plates. Not a torch-side concern: it runs in the release workflow.
    "pillow>=10.2",
]

[project.optional-dependencies]
# Heavy, Colab-side only. The rollup/fusion core deliberately depends on numpy alone
# so its tests run anywhere in seconds.
torch = ["torch>=2.2", "open_clip_torch>=2.24", "pillow>=10.2"]
export = ["onnx>=1.16", "onnxruntime>=1.17", "onnxscript>=0.1", "open_clip_torch>=2.24"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
# Every stage has an entry point, and every committed artefact has a builder behind one.
# Three artefacts once shipped with no committed builder and carried bugs for weeks
# (taxonomy §28, reference index §37, head + bridge §42). That is the rule this list keeps.
lifelist-taxa = "lifelist_train.cli.taxa:main"
lifelist-images = "lifelist_train.cli.images:main"
# Stage 3 needs the torch extra at runtime, but its sharding, resume and failure logic
# is pure and tested without it — so the entry point is declared and `--dry-run` works
# on a machine with no GPU and no torch.
lifelist-embed = "lifelist_train.cli.embed:main"
lifelist-bridge = "lifelist_train.cli.bridge:main"
lifelist-train = "lifelist_train.cli.train:main"
lifelist-export = "lifelist_train.cli.export:main"
lifelist-reference-photos = "lifelist_train.cli.reference:main"
lifelist-reference-index = "lifelist_train.cli.reference_index:main"
lifelist-wikipedia = "lifelist_train.cli.wikipedia:main"
lifelist-redlist = "lifelist_train.cli.redlist:main"
lifelist-thresholds = "lifelist_train.cli.thresholds:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
