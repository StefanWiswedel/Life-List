[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifelist-train"
version = "0.1.0"
description = "Training pipeline for Life List — Danish organism identification"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Heavy, Colab-side only. The rollup/fusion core deliberately depends on numpy alone
# so its tests run anywhere in seconds.
torch = ["torch>=2.2", "open_clip_torch>=2.24", "pillow>=10.2"]
export = ["onnx>=1.16", "onnxruntime>=1.17"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
# Only implemented stages are declared. Stages 4-6 (train-head, evaluate, export) are
# still unwritten: they depend on having real embeddings to train against, and untested
# code in a stage that costs hours to re-run is the worst place to be wrong.
lifelist-taxa = "lifelist_train.cli.taxa:main"
lifelist-images = "lifelist_train.cli.images:main"
# Stage 3 needs the torch extra at runtime, but its sharding, resume and failure logic
# is pure and tested without it — so the entry point is declared and `--dry-run` works
# on a machine with no GPU and no torch.
lifelist-embed = "lifelist_train.cli.embed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
